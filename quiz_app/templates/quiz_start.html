{% extends 'base.html' %}

{% block title %}Start a Quiz - Nexora{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px; margin: 0 auto;">
    <span class="pill">Quick quiz</span>
    <h2 style="margin-top: 0.8rem;">Start a practice quiz</h2>
    <p class="muted">Choose a language and begin your next learning session.</p>

    {% if error_message %}
        <div class="error-message">{{ error_message }}</div>
    {% endif %}

    <form action="{% url 'quiz_app:start_quiz' %}" method="post">
        {% csrf_token %}
        <div class="form-row">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required placeholder="Guest Name">
        </div>
        <div class="form-row">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" required placeholder="guest@example.com">
        </div>
        <div class="form-row">
            <label for="language">Programming Language</label>
            <select id="language" name="language" required>
                <option value="">-- Select a language --</option>
                <option value="C">C</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
            </select>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Begin Quiz</button>
    </form>
</div>
{% endblock %}
