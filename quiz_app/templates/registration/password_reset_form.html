{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 480px; margin: 0 auto;">
    <h2>Reset Password</h2>
    <p class="muted">Enter your registered email address to receive a password reset link.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <label for="id_email">Email Address</label>
            <input type="email" name="email" id="id_email" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Send Reset Link</button>
    </form>
</div>
{% endblock %}
