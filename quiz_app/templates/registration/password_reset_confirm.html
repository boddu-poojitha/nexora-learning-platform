{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 480px; margin: 0 auto;">
    <h2>Set New Password</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Change Password</button>
    </form>
</div>
{% endblock %}
